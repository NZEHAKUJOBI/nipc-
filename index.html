<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nigeria Investment Marketplace 2026</title>
  <meta name="description"
    content="Mobilising Investment for Nigeria's Development. UNDP IOM Sector Pitches, IOM and Projects Nigeria." />
  <meta name="theme-color" content="#033a5c" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@700&display=swap"
    rel="stylesheet" />
  <link rel="preload" as="image" href="assets/nipc-logo.webp" />

  <style>
    /* All sizes are in --u: one pixel of the 1672x941 reference design. */
    :root {
      --u: max(min(calc(100vw / 1672), calc(100vh / 941)), 0.5px);
      --white: #ffffff;
      --gold: #e8c26a;
      --gold-pale: #f6e08f;
      --rule: #d9b45f;
      --btn-top: #07274f;
      --btn-bottom: #02173a;
      --btn-hover-top: #0e3a72;
      --btn-hover-bottom: #082a5c;
      --btn-border: #4a90e6;
      --btn-border-top: #8ccdf0;
      --display: "Montserrat", "Segoe UI", Arial, sans-serif;
      --heading: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
      --ui: "Inter", "Segoe UI", Arial, sans-serif;
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: #033a5c;
    }

    body {
      min-height: 100vh;
      color: var(--white);
      font-family: var(--ui);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: #033a5c url("assets/bg-landscape.webp") center / cover no-repeat;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: calc(var(--u) * 36);
      padding-bottom: calc(var(--u) * 175);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .logo {
      display: block;
      width: calc(var(--u) * 384);
      max-width: 100%;
      height: auto;
      aspect-ratio: 768 / 255;
      margin-bottom: calc(var(--u) * 24.5);
    }

    .title {
      font-family: var(--display);
      font-weight: 800;
    }

    .title span {
      display: block;
      white-space: nowrap;
    }

    .title-nigeria {
      display: flex !important;
      align-items: center;
      justify-content: center;
      gap: calc(var(--u) * 30);
      font-size: calc(var(--u) * 63);
      line-height: calc(var(--u) * 55);
    }

    .title-nigeria::before,
    .title-nigeria::after {
      content: "";
      width: calc(var(--u) * 90);
      height: max(1px, calc(var(--u) * 2));
      background: linear-gradient(to right, transparent, var(--rule));
    }

    .title-nigeria::after {
      background: linear-gradient(to left, transparent, var(--rule));
    }

    .title .title-investment {
      font-size: calc(var(--u) * 55);
      line-height: calc(var(--u) * 54);
      color: var(--gold);
    }

    .title .title-marketplace {
      font-size: calc(var(--u) * 42.7);
      line-height: calc(var(--u) * 44);
      font-weight: 700;
    }

    .title .title-year {
      display: inline;
      color: var(--gold);
      font-weight: 800;
    }

    .tagline {
      font-family: var(--display);
      font-size: calc(var(--u) * 22.5);
      line-height: calc(var(--u) * 26);
      font-weight: 600;
      color: var(--gold);
      margin-top: calc(var(--u) * 14);
      text-wrap: balance;
    }

    .tagline strong {
      font-weight: 600;
      color: var(--gold-pale);
    }

    .section-heading {
      font-family: var(--heading);
      font-size: calc(var(--u) * 36.8);
      line-height: calc(var(--u) * 42);
      font-weight: 700;
      margin-top: calc(var(--u) * 40);
      text-wrap: balance;
      text-shadow: 0 1px 6px rgba(0, 20, 50, 0.45);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 20.5);
      width: calc(var(--u) * 818);
      max-width: 100%;
      margin-top: calc(var(--u) * 40);
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: max(44px, calc(var(--u) * 74));
      padding: 4px 16px calc(var(--u) * 4 + 4px);
      border: max(1px, calc(var(--u) * 1.5)) solid var(--btn-border);
      border-top-color: var(--btn-border-top);
      border-radius: calc(var(--u) * 20);
      background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
      box-shadow: 0 calc(var(--u) * 8) calc(var(--u) * 22) rgba(2, 16, 45, 0.4);
      color: var(--white);
      font-family: var(--ui);
      font-size: max(15px, calc(var(--u) * 29));
      letter-spacing: 0.02em;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .link-btn:hover {
      background: linear-gradient(180deg, var(--btn-hover-top), var(--btn-hover-bottom));
      border-color: #8fc0f7;
    }

    .link-btn:focus-visible {
      outline: 3px solid var(--gold-pale);
      outline-offset: 3px;
    }

    @media (max-aspect-ratio: 1/1) {
      :root {
        --u: min(calc(100vw / 560), calc(100vh / 800));
      }

      .backdrop {
        background-image: url("assets/bg-portrait.webp");
      }

      .page {
        padding-top: calc(var(--u) * 36);
        padding-bottom: calc(var(--u) * 36);
      }

      .tagline {
        font-size: calc(var(--u) * 20);
      }

      .section-heading {
        max-width: calc(var(--u) * 500);
      }

      .links {
        width: calc(var(--u) * 500);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .link-btn {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script>
    const h = React.createElement;

    const LINKS = [
      {
        label: "UNDP IOM Sector Pitches",
        href: "https://drive.google.com/drive/folders/1qs07X-oADfyB7zEHk20DOQLtRISLUeOz?usp=drive_link",
      },
      {
        label: "Investment Opportunity Mapping (IOM",
        href: "https://drive.google.com/file/d/16jrzGCsog6zHhOy08MC5DODXdhPYpVVI/view?usp=drive_link",
      },
      {
        label: "Projects Nigeria",
        href: "https://finance.gov.ng/projectsnigeria",
      },
    ];

    function App() {
      return h(React.Fragment, null,
        h("div", { className: "backdrop", "aria-hidden": "true" }),
        h("main", { className: "page" },
          h("img", {
            className: "logo",
            src: "assets/nipc-logo.webp",
            width: 768,
            height: 255,
            alt: "Nigerian Investment Promotion Commission (NIPC)",
          }),
          h("h1", { className: "title" },
            h("span", { className: "title-nigeria" }, "NIGERIA"),
            h("span", { className: "title-investment" }, "INVESTMENT"),
            h("span", { className: "title-marketplace" },
              "MARKETPLACE ",
              h("span", { className: "title-year" }, "2026")
            )
          ),
          h("p", { className: "tagline" },
            "Mobilising Investment for ",
            h("strong", null, "Nigeria’s Development")
          ),
          h("h2", { className: "section-heading" }, "UNDP IOM Sector Pitches, IOM and Projects Nigeria"),
          h("nav", { className: "links", "aria-label": "Event documents" },
            LINKS.map(function (link) {
              return h("a", {
                key: link.href,
                className: "link-btn",
                href: link.href,
                target: "_blank",
                rel: "noopener noreferrer",
              }, link.label);
            })
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>

</html>
